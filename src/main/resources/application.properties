spring.application.name=Blue_Bird_Vacation_Planner

# MySQL connection placeholders. Override these values with environment variables
# or local configuration before running the application.
spring.jpa.hibernate.ddl-auto=update

app.admin.credentials=${SEED_ADMIN_CREDENTIALS}

spring.datasource.url=${MYSQL_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

JWT.EXPIRES_IN_HOURS=12
JWT_SECRET_KEY=${JWT_SECRET_KEY}

maps.api.key=${MAPS_API_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}