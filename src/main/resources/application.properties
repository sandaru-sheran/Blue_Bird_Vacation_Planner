spring.application.name=Blue_Bird_Vacation_Planner

# MySQL connection placeholders. Override these values with environment variables
# or local configuration before running the application.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${MYSQL_DATABASE_URL:jdbc:mysql://localhost:3306/blue_bird_vacation_planner?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

JWT.EXPIRES_IN_HOURS=12
JWT_SECRET_KEY=${JWT_SECRET_KEY}